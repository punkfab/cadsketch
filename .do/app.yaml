# DigitalOcean App Platform spec for cadsketch.ai (landing + /app).
# NOT applied automatically. To apply:
#   doctl apps update 2c7a1f4c-0e2e-4067-b24c-37c1bbca9eaf --spec .do/app.yaml
#
# The only difference from the spec that was live on 2026-09-30 is the CORS
# rule: it lets any origin READ the static files. An AI chat host can sandbox
# the embedded editor into an opaque origin, where the editor's own fetches
# (WASM kernel, fonts) count as cross-origin and are refused without it.
domains:
- domain: cadsketch.ai
  type: PRIMARY
ingress:
  rules:
  - component:
      name: cadsketch
    match:
      path:
        prefix: /
    cors:
      allow_origins:
      - regex: .*
      allow_methods:
      - GET
      - HEAD
      - OPTIONS
name: cadsketch
region: nyc
static_sites:
- catchall_document: index.html
  github:
    branch: site
    deploy_on_push: true
    repo: punkfab/cadsketch
  index_document: index.html
  name: cadsketch
  source_dir: /
