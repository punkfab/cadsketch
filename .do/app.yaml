# DigitalOcean App Platform spec for the CADSketch landing page.
#
# A plain static HTML site (no build step) served from the landing/ directory
# of the ai-sketcher repo. Auto-redeploys on push to main.
#
# Spin up:
#   doctl apps create --spec .do/app.yaml
# Update an existing app:
#   doctl apps update <APP_ID> --spec .do/app.yaml
#
# Prereqs: DO must be authorized on the (private) GitHub repo — do this once in
# the DO console (Settings → GitHub) or you'll get a repo-access error.
name: cadsketch
region: nyc
static_sites:
  - name: cadsketch
    github:
      repo: dnewcome/ai-sketcher
      branch: main
      deploy_on_push: true
    # No build command — files are served as-is from this directory.
    source_dir: landing
    index_document: index.html
    catchall_document: index.html
    routes:
      - path: /
# DNS stays at the registrar (no DO nameserver delegation). DO only needs a
# record pointing cadsketch.ai at the app's ingress hostname; with no `zone`,
# DO will not try to manage the domain's zone.
domains:
  - domain: cadsketch.ai
    type: PRIMARY
