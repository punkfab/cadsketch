# DigitalOcean App Platform spec for CADSketch.
#
# Serves the prebuilt static site from the `site` branch (no build step here):
#   /     → the landing page
#   /app  → the Flutter web app (C++ kernel compiled to WASM)
# The `site` branch is produced by .github/workflows/web.yml on every push to
# main; DO redeploys on push to `site`.
#
# Update an existing app:
#   doctl apps update <APP_ID> --spec .do/app.yaml
#
# Prereqs: DO must be authorized on the (private) GitHub repo — do this once in
# the DO console (Settings → GitHub) or you'll get a repo-access error.
name: cadsketch
region: nyc
static_sites:
  - name: cadsketch
    github:
      repo: dnewcome/ai-sketcher
      branch: site
      deploy_on_push: true
    # Prebuilt by CI — served as-is from the branch root.
    source_dir: /
    index_document: index.html
    catchall_document: index.html
    routes:
      - path: /
# DNS stays at the registrar (no DO nameserver delegation). DO only needs a
# record pointing cadsketch.ai at the app's ingress hostname; with no `zone`,
# DO will not try to manage the domain's zone.
domains:
  - domain: cadsketch.ai
    type: PRIMARY
