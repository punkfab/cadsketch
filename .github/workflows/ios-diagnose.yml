name: iOS kernel diagnostic (no signing)

# Cert-free way to debug the C++ kernel link on iOS: builds with --no-codesign
# (no signing, no archive, no upload → no certificates created, nothing sent to
# TestFlight) and dumps where sk_* symbols are (or aren't) through every layer.
# Trigger manually from the Actions tab or: gh workflow run ios-diagnose.yml
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Flutter skips CocoaPods when there are no plugin packages (this app is
      # pure FFI), so our Podfile/kernel pod is never installed. Generate the
      # Flutter xcconfig, then run pod install explicitly.
      - name: Install pods (explicit)
        run: |
          flutter build ios --config-only --release --no-codesign
          cd ios && pod install
          echo "=== Podfile.lock after explicit install ==="; cat Podfile.lock | head -20

      - name: Build Flutter iOS (no codesign)
        run: flutter build ios --release --no-codesign

      # Archive WITHOUT signing (CODE_SIGNING_ALLOWED=NO mints no certificate and
      # uploads nothing) so this faithfully runs the install action + strip — the
      # exact step that drops symbols. A plain `flutter build` skips that strip
      # and gives a false green, so we must inspect the *archive* binary.
      - name: Archive (no signing)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner -configuration Release \
            -archivePath build/Runner.xcarchive archive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual

      - name: Kernel build diagnostic
        run: |
          set +e
          echo "===== 1. sketch_kernel in Podfile.lock? ====="
          grep -A2 -i "sketch_kernel" ios/Podfile.lock || echo "(NOT in Podfile.lock)"
          echo "===== 2. how did strip run? (STRIP_STYLE / strip invocation) ====="
          gs() { :; }
          echo "===== 3. libsketch_kernel.a + does it contain sk_version? ====="
          find ~/Library/Developer/Xcode/DerivedData "$PWD/build" -name 'libsketch_kernel.a' 2>/dev/null | while read f; do
            echo "--- $f"; nm "$f" 2>/dev/null | grep -i "sk_version" | head -1 || echo "    (no sk_version in archive)"
          done
          echo "===== 4. ARCHIVE binary (the one that ships) ====="
          BIN="build/Runner.xcarchive/Products/Applications/Runner.app/Runner"
          ls -la "$BIN" 2>/dev/null || echo "(archive binary MISSING at expected path)"
          echo "--- nm:"
          nm "$BIN" 2>/dev/null | grep -i "sk_version\|sk_create" || echo "(NONE in archive binary via nm)"
          echo "--- dyld_info -exports (what dlsym sees):"
          xcrun dyld_info -exports "$BIN" 2>/dev/null | grep -i "sk_" || echo "(NONE in exports trie)"
          echo "===== 5. flutter-build binary (for comparison) ====="
          FB="build/ios/iphoneos/Runner.app/Runner"
          xcrun dyld_info -exports "$FB" 2>/dev/null | grep -i "sk_version" || echo "(NONE in flutter-build exports trie)"
          true
