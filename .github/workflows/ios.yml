name: iOS TestFlight

# Builds + uploads to TestFlight on a release tag (cut a build intentionally;
# macOS runners bill ~10x, so we don't build on every push), plus manual
# dispatch from the Actions tab. The build number is derived automatically from
# the Unix epoch — no manual pubspec bump, and never a duplicate.
#
#   git tag ios-v0.1.0 && git push origin ios-v0.1.0   →  builds & uploads
#
# Unlike most Flutter apps, this one statically links a C++ geometry kernel
# (native/sketch_kernel.cpp) via the local CocoaPod in ios/. `pod install`
# (run by `flutter build ios`) compiles it; the Podfile force-loads it.
on:
  push:
    tags:
      - 'ios-v*'
  workflow_dispatch:

jobs:
  build-and-upload:
    # macos-26 ships Xcode 26 (iOS 26 SDK) — App Store Connect rejects uploads
    # built with anything older.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Select latest Xcode (iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # flutter test runs on the Dart VM via the native FFI path, so it needs
      # the kernel dylib present at build/native/ (the loader's fallback).
      - name: Build native kernel (for tests)
        run: |
          brew install cmake ninja
          bash build_native.sh

      - name: Run tests
        run: flutter test

      # Marketing version (x.y.z) from the tag (ios-v0.1.0 → 0.1.0) or pubspec.
      # Build number = Unix epoch seconds: always large and monotonically
      # increasing, so an older manual upload can never sort above a CI build
      # (TestFlight orders by build number).
      - name: Compute version + build number
        id: ver
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" == ios-v* ]]; then
            VERSION="${REF#ios-v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          fi
          BUILD=$(date -u +%s)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (+$BUILD)"

      # The App Store Connect API key drives cloud signing (xcodebuild
      # fetches/creates the distribution cert + profile itself) and the
      # TestFlight upload. No .p12, no keychain. Key role: App Manager or Admin.
      - name: Install App Store Connect API key
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$P8" > ~/private_keys/AuthKey_${KEY_ID}.p8

      # Reuse a persistent Apple Distribution identity so automatic signing does
      # NOT mint a new cloud-managed certificate on every ephemeral runner — that
      # filled the account's certificate cap and broke the archive. No-ops until
      # IOS_P12_BASE64 / IOS_P12_PASSWORD are set (then falls back to cloud signing).
      - name: Import distribution certificate
        env:
          P12_B64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          if [ -z "$P12_B64" ]; then
            echo "IOS_P12_BASE64 not set — falling back to cloud-managed signing"
            exit 0
          fi
          KC="$RUNNER_TEMP/ci-signing.keychain-db"
          KC_PASS=$(uuidgen)
          printf '%s' "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KC"

      # Flutter skips CocoaPods when there are no plugin packages (this app is
      # pure FFI), so the kernel pod is never installed and the C++ kernel never
      # links in. Generate the Flutter xcconfig, then run pod install explicitly
      # so the archive (which uses Runner.xcworkspace) includes the kernel.
      - name: Install pods (explicit)
        run: |
          flutter build ios --config-only --release --no-codesign
          cd ios && pod install

      - name: Build Flutter iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ steps.ver.outputs.version }} \
            --build-number=${{ steps.ver.outputs.build }}

      - name: Archive with cloud signing
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner -configuration Release \
            -archivePath build/Runner.xcarchive archive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=W527ZN3X52

      # Ground-truth check: trace the kernel through every build layer.
      - name: Inspect kernel build (diagnostic)
        run: |
          set +e
          echo "===== 1. Did pod install include sketch_kernel? ====="
          grep -A2 -i "sketch_kernel" ios/Podfile.lock || echo "(sketch_kernel NOT in Podfile.lock)"
          echo "===== 2. Was the .cpp compiled? (sketch_kernel.o objects) ====="
          find ~/Library/Developer/Xcode/DerivedData "$PWD/build" -name 'sketch_kernel*.o' 2>/dev/null | head
          echo "===== 3. Built archives + do THEY contain sk_ symbols? ====="
          find ~/Library/Developer/Xcode/DerivedData "$PWD/build" -name 'libsketch_kernel.a' 2>/dev/null | while read f; do
            echo "--- $f"; nm "$f" 2>/dev/null | grep -i "sk_version" | head -2 || echo "    (no sk_version in this .a)"
          done
          echo "===== 4. Is the pod in Runner's link flags? ====="
          grep -riE "sketch_kernel|force_load|exported_symbols" "ios/Pods/Target Support Files/Pods-Runner/"*.xcconfig 2>/dev/null || echo "(nothing in Pods-Runner xcconfig)"
          echo "===== 5. Final binary symbols ====="
          BIN="build/Runner.xcarchive/Products/Applications/Runner.app/Runner"
          nm "$BIN" 2>/dev/null | grep -i "sk_version\|sk_create" || echo "(NONE in final binary)"
          xcrun dyld_info -exports "$BIN" 2>/dev/null | grep -i "sk_" || echo "(NONE in exports trie)"
          true

      - name: Export and upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptionsCI.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      # --- App Store staging (tag builds only; stops before Submit) ---------
      # On an ios-v* tag, after the build is up, wait for it to process and push
      # the full App Store listing (metadata, availability, age rating, attach
      # this build). Review contact + App Privacy are one-time/persistent and NOT
      # set here, so no PII goes through CI. Nothing is ever submitted to review
      # automatically — that stays a human click.
      - name: Stage App Store listing (stop before Submit)
        if: github.ref_type == 'tag'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          python3 -m venv /tmp/ascv
          /tmp/ascv/bin/pip install --quiet pyjwt cryptography requests
          export ASC_KEY_PATH=$(ls ~/private_keys/AuthKey_*.p8)
          echo "== waiting for build ${{ steps.ver.outputs.build }} to process =="
          /tmp/ascv/bin/python tools/asc_wait_build.py cadsketcher.ai.app ${{ steps.ver.outputs.build }}
          echo "== staging listing for ${{ steps.ver.outputs.version }} =="
          /tmp/ascv/bin/python tools/asc_listing.py \
            --bundle-id cadsketcher.ai.app \
            --dir ios/appstore \
            --version ${{ steps.ver.outputs.version }} \
            --build ${{ steps.ver.outputs.build }}
          echo "::notice::Listing staged for ${{ steps.ver.outputs.version }}. Remaining manual steps: App Privacy questionnaire + Submit for Review."

      - name: Clean up key + keychain
        if: always()
        run: |
          rm -rf ~/private_keys
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
