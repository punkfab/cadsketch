name: Web (landing + app) → DigitalOcean

# Builds the static site and publishes it to the `site` branch, which the
# DigitalOcean App Platform static site serves (deploy_on_push). The site is:
#   /        → the landing page (landing/)
#   /app     → the Flutter web app, with the C++ kernel compiled to WASM
#
# Runs on ubuntu (cheap), unlike the macOS iOS build. The kernel is built once
# here (emscripten) and once natively for iOS — same native/sketch_kernel.cpp.
#
# Speed: this is the fast push-to-prod loop, so the DEPLOY job is the short
# critical path — it does NOT run tests or build the native kernel. Tests run in
# a parallel `test` job that surfaces regressions on the commit without blocking
# the publish. The compiled WASM kernel is cached on the C++ source, so a
# Dart-only change (the common case) skips the emscripten toolchain entirely.
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'native/**'
      - 'web/**'
      - 'landing/**'
      - 'pubspec.*'
      - 'build_wasm.sh'
      - '.github/workflows/web.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # peaceiris/actions-gh-pages pushes the built site to the `site` branch,
    # which needs write access to repo contents (GITHUB_TOKEN is read-only by default).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      # The compiled kernel (web/kernel/sketch_kernel.{js,wasm}) only changes
      # when the C++ source or the build script does. Restore it on a Dart-only
      # change so the emscripten setup + compile below are skipped.
      - name: Cache the WASM kernel
        id: wasm
        uses: actions/cache@v4
        with:
          path: |
            web/kernel/sketch_kernel.js
            web/kernel/sketch_kernel.wasm
          key: wasm-kernel-${{ hashFiles('native/**', 'build_wasm.sh') }}

      - name: Set up emscripten
        if: steps.wasm.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.69

      - name: Build the WASM kernel
        if: steps.wasm.outputs.cache-hit != 'true'
        run: bash build_wasm.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web (served under /app)
        run: flutter build web --release --base-href /app/

      - name: Assemble site (landing at /, app at /app)
        run: |
          rm -rf public && mkdir -p public
          cp -r landing/. public/
          cp -r build/web public/app

      - name: Publish to the site branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: site
          force_orphan: true

  # Runs in parallel with deploy: surfaces test regressions on the commit but
  # does NOT gate the publish (this is the fast iteration loop). flutter test
  # runs on the Dart VM via the native FFI path, so it needs the kernel .so.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build native kernel (for tests)
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          bash build_native.sh

      - name: Run tests
        run: flutter test
