<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CADSketch — freehand sketches become constrained, dimensioned parametric CAD.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CADSketch">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CADSketch</title>
  <link rel="manifest" href="manifest.json">

  <!-- Geometry kernel (C++ compiled to WASM). Loaded synchronously so the
       SketchKernelReady promise exists before Flutter's main() awaits it.
       Order matters: the emscripten factory first, then the glue. -->
  <script src="kernel/sketch_kernel.js"></script>
  <script src="kernel/kernel_glue.js"></script>

  <!-- Visit counting (Cloudflare Web Analytics, no cookies). This file is only
       part of the web build, so the iOS app has no analytics at all.
       The counter drops the query string, so an editor embedded in an AI app
       (?mcp=1) would look like the standalone app. Give it its own path first;
       <base href> keeps every asset resolving from /app/. Where the browser
       refuses (a sandbox with no origin), it simply counts as /app/. -->
  <script>
    try {
      if (new URLSearchParams(location.search).get('mcp') === '1' &&
          !/\/embed\/$/.test(location.pathname)) {
        history.replaceState(null, '', new URL('embed/', document.baseURI).pathname + location.search);
      }
    } catch (e) {}
  </script>
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "2f2d9eaebfd845cc8366ce51693ad086"}'></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
