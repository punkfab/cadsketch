# DigitalOcean App Platform: the MCP server as a service on the existing
# cadsketch app, reachable at https://cadsketch.ai/mcp.
#
# NOT applied automatically: it adds a paid component (basic-xxs, about $5/mo).
# To apply, merge the two blocks below into the live spec and update:
#
#   doctl apps spec get 2c7a1f4c-0e2e-4067-b24c-37c1bbca9eaf > app.yaml
#   # add the `services:` block and the extra ingress rule, keeping the rest
#   doctl apps update 2c7a1f4c-0e2e-4067-b24c-37c1bbca9eaf --spec app.yaml
#
# The /mcp rule must come BEFORE the catch-all "/" rule of the static site.

services:
  - name: mcp
    github:
      repo: punkfab/cadsketch
      branch: main
      deploy_on_push: true
    source_dir: mcp
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 8080
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: PORT
        value: "8080"
      - key: CADSKETCH_APP_URL
        value: https://cadsketch.ai/app/
    health_check:
      http_path: /

ingress:
  rules:
    - component:
        name: mcp
        preserve_path_prefix: true
      match:
        path:
          prefix: /mcp
    # ... existing rule: component cadsketch, prefix /
